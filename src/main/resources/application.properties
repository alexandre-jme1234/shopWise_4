spring.application.name=app

spring.datasource.url=jdbc:h2:mem:shopwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT (dev) : la clé doit faire au moins 32 caractères. Surcharger en prod via APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-key-change-me-32chars-min}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}